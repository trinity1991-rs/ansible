---
- name: Update and Full Upgrade Ubuntu Servers
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Get list of upgradable packages before upgrade
      command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Show packages to be upgraded
      debug:
        msg: "{{ upgradable_packages.stdout_lines }}"

    - name: Full upgrade all packages
      apt:
        upgrade: full
        autoremove: yes
        autoclean: yes
      register: upgrade_result

    - name: Show upgrade summary
      debug:
        msg: "{{ upgrade_result.stdout_lines }}"
      when: upgrade_result.stdout_lines is defined

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      reboot:
        msg: "Reboot triggered by Ansible after full upgrade"
        reboot_timeout: 300
      when: reboot_required.stat.exists
